name: Validate AuraBook
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/aurabook?schema=public
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/aurabook?schema=public
          AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
